name: Build Theos tweak
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          set -e
          brew update || true
          brew install dpkg || true
          brew install ldid || true

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos

      - name: Build with Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          echo "Using THEOS=$THEOS"
          make package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.deb

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.${{ github.run_number }}
          release_name: NoInAppSafari v0.1.${{ github.run_number }}
          body: "Automated release from workflow run ${{ github.run_number }}"
          draft: false
          prerelease: false

      - name: Find built .deb
        id: find_package
        run: |
          set -e
          pkg=$(ls packages/*.deb | head -n1)
          echo "package=$pkg" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_package.outputs.package }}
          asset_name: ${{ steps.find_package.outputs.package }}
          asset_content_type: application/octet-stream
