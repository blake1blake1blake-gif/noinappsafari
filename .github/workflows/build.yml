name: Build Theos tweak
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ runner.home }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          set -e
          brew update || true
          brew install dpkg ldid || true
          # common build tools that may be required by some projects
          brew install autoconf automake gnu-sed coreutils || true

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $THEOS

      - name: Add Theos bin to PATH
        run: |
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Ensure Theos tools are executable
        run: |
          chmod +x "$THEOS/bin"/* || true

      - name: Ensure dm.pl present
        run: |
          set -e
          mkdir -p "$THEOS/bin"
          # If dm.pl is missing from theos, pull it from theos master branch
          if [ ! -f "$THEOS/bin/dm.pl" ]; then
            echo "dm.pl not found in $THEOS/bin, downloading from theos repo"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$THEOS/bin/dm.pl"
          else
            echo "dm.pl already present"
          fi
          chmod +x "$THEOS/bin/dm.pl"
          # Ensure Theos bin and Homebrew bin are on PATH for following steps
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Debug Theos install
        run: |
          echo "--- Debug: Theos environment ---"
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"
          echo "--- ls THEOS root ---"
          ls -la "$THEOS" || true
          echo "--- ls THEOS bin ---"
          ls -la "$THEOS/bin" || true
          echo "--- which dm.pl ---"
          which dm.pl || true
          echo "--- check dm.pl file ---"
          if [ -f "$THEOS/bin/dm.pl" ]; then
            echo "dm.pl exists at $THEOS/bin/dm.pl"
            echo "--- head of dm.pl ---"
            head -n 5 "$THEOS/bin/dm.pl" || true
            echo "--- perl --version ---"
            perl -v || true
          else
            echo "dm.pl NOT found in $THEOS/bin"
          fi
          echo "--- dpkg-deb location/version ---"
          which dpkg-deb || true
          dpkg-deb --version || true

      - name: Build with Theos
        run: |
          set -e
          echo "Using THEOS=$THEOS"
          make package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.deb

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.${{ github.run_number }}
          release_name: NoInAppSafari v0.1.${{ github.run_number }}
          body: "Automated release from workflow run ${{ github.run_number }}"
          draft: false
          prerelease: false

      - name: Find built .deb
        id: find_package
        run: |
          set -e
          pkg=$(ls packages/*.deb | head -n1)
          echo "package=$pkg" >> $GITHUB_OUTPUT
          echo "package_name=$(basename $pkg)" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_package.outputs.package }}
          asset_name: ${{ steps.find_package.outputs.package_name }}
          asset_content_type: application/octet-stream
