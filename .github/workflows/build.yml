name: Build Theos tweak
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ runner.home }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites (with retries)
        run: |
          set -e
          retry() {
            local n=1
            local max=3
            local delay=5
            while true; do
              "$@" && break || {
                if [ "$n" -lt "$max" ]; then
                  n=$((n+1))
                  echo "Command failed. Attempt $n/$max:" "$@"
                  sleep $delay
                else
                  echo "The command has failed after $n attempts." >&2
                  return 1
                fi
              }
            done
          }
          retry brew update || true
          retry brew install dpkg ldid || true
          retry brew install autoconf automake gnu-sed coreutils || true

      - name: Install Theos (full recursive clone with retries)
        run: |
          set -e
          retry() {
            local n=1
            local max=3
            local delay=5
            while true; do
              "$@" && break || {
                if [ "$n" -lt "$max" ]; then
                  n=$((n+1))
                  echo "Command failed. Attempt $n/$max:" "$@"
                  sleep $delay
                else
                  echo "The command has failed after $n attempts." >&2
                  return 1
                fi
              }
            done
          }
          # Remove any partial clone and retry a full recursive clone
          rm -rf "$THEOS"
          retry git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Ensure Theos bin on PATH and executable
        run: |
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          chmod +x "$THEOS/bin"/* || true

      - name: Ensure dm.pl present (download if missing)
        run: |
          set -e
          mkdir -p "$THEOS/bin"
          if [ ! -f "$THEOS/bin/dm.pl" ]; then
            echo "dm.pl not found in $THEOS/bin, downloading from theos repo"
            curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o "$THEOS/bin/dm.pl" || {
              echo "Failed to download dm.pl" >&2
              ls -la "$THEOS/bin" || true
              exit 1
            }
          else
            echo "dm.pl already present"
          fi
          chmod +x "$THEOS/bin/dm.pl"

      - name: Debug Theos install
        run: |
          echo "--- Debug: Theos environment ---"
          echo "THEOS=$THEOS"
          echo "GIT_COMMIT: $(git -C $THEOS rev-parse --short HEAD 2>/dev/null || true)"
          echo "--- ls THEOS root ---"
          ls -la "$THEOS" || true
          echo "--- ls THEOS bin ---"
          ls -la "$THEOS/bin" || true
          echo "--- which dm.pl ---"
          which dm.pl || true
          echo "--- check dm.pl file ---"
          if [ -f "$THEOS/bin/dm.pl" ]; then
            echo "dm.pl exists at $THEOS/bin/dm.pl"
            echo "--- head of dm.pl ---"
            head -n 5 "$THEOS/bin/dm.pl" || true
            echo "--- perl --version ---"
            perl -v || true
          else
            echo "dm.pl NOT found in $THEOS/bin"
          fi
          echo "--- dpkg-deb location/version ---"
          which dpkg-deb || true
          dpkg-deb --version || true

      - name: Build with Theos
        run: |
          set -e
          # Ensure brew and Theos bins are available in this shell
          export PATH="$(brew --prefix)/bin:$THEOS/bin:$PATH"
          echo "Using THEOS=$THEOS"
          echo "PATH=$PATH"
          which dm.pl || { echo "dm.pl not found on PATH"; ls -la "$THEOS/bin"; exit 1; }
          make package

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.deb

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.${{ github.run_number }}
          release_name: NoInAppSafari v0.1.${{ github.run_number }}
          body: "Automated release from workflow run ${{ github.run_number }}"
          draft: false
          prerelease: false

      - name: Find built .deb
        id: find_package
        run: |
          set -e
          pkg=$(ls packages/*.deb | head -n1)
          echo "package=$pkg" >> $GITHUB_OUTPUT
          echo "package_name=$(basename $pkg)" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_package.outputs.package }}
          asset_name: ${{ steps.find_package.outputs.package_name }}
          asset_content_type: application/octet-stream
